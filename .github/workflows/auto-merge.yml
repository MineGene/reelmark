name: Auto-merge

# Turns on squash auto-merge for the maintainer's own pull requests (which
# includes every pull request Claude opens). GitHub then merges each one by
# itself as soon as every required check passes, including the maintainer's
# review label when sensitive files change. Nothing merges any sooner or
# with fewer checks than a manual merge would.
#
# Pull requests from forks and from Dependabot are left for the maintainer
# to merge by hand.
#
# Note: merges made this way don't start other workflows (GitHub never lets
# its own token trigger more runs), which is why Release runs on a schedule.
on:
  pull_request:
    types: [opened, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  enable:
    name: Enable auto-merge
    if: >-
      github.event.pull_request.user.login == github.repository_owner &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # merge into main
      pull-requests: write # turn on auto-merge
    steps:
      - name: Enable squash auto-merge
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.pull_request.number }}
        run: gh pr merge "$NUMBER" --repo "$GITHUB_REPOSITORY" --auto --squash
