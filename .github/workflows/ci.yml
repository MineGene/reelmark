name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, to catch breakage from runner, macOS or Xcode updates.
    - cron: "41 2 * * 1"
  workflow_dispatch:

# Read-only token; no secrets are used anywhere in CI, so fork PRs are safe.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Decides whether the macOS jobs below need to run (scripts/ci-changes.sh).
  # A pull request that changes only docs, the changelog or unrelated
  # scripts skips them; GitHub counts a job skipped by its `if:` as passing,
  # so required checks don't block the merge, and no Mac runner is used.
  # Workflow-level `paths:` filters aren't used: a required check filtered
  # out that way never reports, and the pull request waits forever.
  changes:
    name: Detect app changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      app: ${{ steps.detect.outputs.app }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # First, so a broken detector leaves no output and everything runs.
      - name: Test the detection script
        run: scripts/test-ci-changes.sh
      - name: Detect
        id: detect
        env:
          # Empty outside pull requests, so pushes to main, the weekly run
          # and manual runs always run everything.
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          app=$(scripts/ci-changes.sh "$BASE" "$HEAD")
          echo "app=$app" >> "$GITHUB_OUTPUT"
          [ "$app" = true ] || echo "Nothing the app or its tests use changed; macOS jobs skipped."

  commit-privacy:
    name: Commit privacy
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check commit emails and trailers
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: scripts/check-commits.sh "$BASE" "$HEAD"

  changelog:
    name: Changelog entries
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check changelog.d entries
        run: scripts/changelog.sh check
      - name: Test the changelog script
        run: scripts/test-changelog.sh
      - name: Test the version choice
        run: scripts/test-next-version.sh

  core-tests:
    # Named in full, not from a matrix: a matrix job skipped by its `if:`
    # reports under its unexpanded name, and the required check
    # "Core tests (xcode-27)" would never arrive.
    name: Core tests (xcode-27)
    needs: changes
    # Runs unless the detector said "false": a failed detection still runs.
    if: ${{ !cancelled() && needs.changes.outputs.app != 'false' }}
    runs-on: xcode-27
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain
        run: xcodebuild -version && swift --version
      - name: Run tests
        run: |
          set +e
          swift test --package-path Packages/ReelmarkCore 2>&1 | tee test.log
          status=${PIPESTATUS[0]}
          scripts/annotate-errors.sh test.log
          exit "$status"

  build-app:
    name: Build and check app
    needs: changes
    # Runs unless the detector said "false": a failed detection still runs.
    if: ${{ !cancelled() && needs.changes.outputs.app != 'false' }}
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select pinned Xcode
        run: scripts/select-xcode.sh
      - name: Build app
        run: scripts/build-app.sh
      - name: Check structure, signature and entitlements
        run: scripts/check-app.sh build/Release/Reelmark.app
      - name: Lint (advisory)
        continue-on-error: true
        run: xcrun swift-format lint --strict --recursive Reelmark Packages/ReelmarkCore

  ui-tests:
    name: UI tests
    needs: changes
    # Runs unless the detector said "false": a failed detection still runs.
    if: ${{ !cancelled() && needs.changes.outputs.app != 'false' }}
    # Launches a Debug build of the app and uses its window like a person
    # would (see ReelmarkUITests), so a crash fails here, not on a Mac.
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select pinned Xcode
        run: scripts/select-xcode.sh
      - name: Run UI tests
        run: |
          set +e
          xcodebuild test \
            -project Reelmark.xcodeproj -scheme Reelmark \
            -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath build/UITests \
            2>&1 | tee ui-tests.log
          status=${PIPESTATUS[0]}
          scripts/annotate-errors.sh ui-tests.log
          exit "$status"

  reproducible:
    name: Reproducible build
    needs: changes
    # Runs unless the detector said "false": a failed detection still runs.
    if: ${{ !cancelled() && needs.changes.outputs.app != 'false' }}
    runs-on: xcode-27
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select pinned Xcode
        run: scripts/select-xcode.sh
      - name: Build twice at different paths and compare
        run: scripts/check-reproducible.sh
