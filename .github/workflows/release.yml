name: Release

# Releases happen by themselves: every night (about 2:40 am in Queensland)
# this checks main, and if the app has changed since the last release it
# builds, tests and publishes the next patch version (0.1.0, 0.1.1, …), then
# a fresh machine downloads and rebuilds it to verify it. Changes to docs,
# tests or CI alone don't make a release.
#
# For a bigger version number, or to release straight away: Actions tab ›
# Release › Run workflow (works from a phone), optionally with a version
# like 0.2.0.
on:
  schedule:
    - cron: "37 16 * * *"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 0.2.0 (blank = next patch version)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  plan:
    name: Decide version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Only release from main
        run: |
          [ "$GITHUB_REF" = "refs/heads/main" ] \
            || { echo "::error::Run the release from the main branch."; exit 1; }
      - name: Next version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          version=$(scripts/next-version.sh "$INPUT_VERSION")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Version to release: ${version:-none}"

  release:
    needs: plan
    if: needs.plan.outputs.version != ''
    runs-on: xcode-27
    timeout-minutes: 45
    environment: release
    permissions:
      contents: write # create the GitHub Release
      id-token: write # sign the provenance attestation
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select pinned Xcode
        run: scripts/select-xcode.sh

      - name: Test core
        run: swift test --package-path Packages/ReelmarkCore

      - name: Build app
        env:
          REELMARK_VERSION: ${{ needs.plan.outputs.version }}
        run: scripts/build-app.sh

      - name: Check app
        run: scripts/check-app.sh build/Release/Reelmark.app

      - name: Record app digest
        id: digest
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          file="build/Reelmark-$VERSION-app-digest.txt"
          scripts/app-digest.sh build/Release/Reelmark.app > "$file"
          echo "sha=$(shasum -a 256 "$file" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "xcode=$(xcodebuild -version | head -n 1)" >> "$GITHUB_OUTPUT"
          echo "macos=$(sw_vers -productVersion)" >> "$GITHUB_OUTPUT"

      - name: Make DMG
        id: dmg
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          name="Reelmark-$VERSION.dmg"
          staging=build/dmg
          rm -rf "$staging" && mkdir -p "$staging"
          ditto build/Release/Reelmark.app "$staging/Reelmark.app"
          ln -s /Applications "$staging/Applications"
          cp LICENSE "$staging/LICENSE.txt"
          hdiutil create -volname Reelmark -srcfolder "$staging" -fs HFS+ -format UDZO -ov "build/$name"
          (cd build && shasum -a 256 "$name" > "$name.sha256")
          cat "build/$name.sha256"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          # The DMG, and the app digest that binds the app inside it to this build.
          subject-path: |
            build/Reelmark-${{ needs.plan.outputs.version }}.dmg
            build/Reelmark-${{ needs.plan.outputs.version }}-app-digest.txt

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          NAME: ${{ steps.dmg.outputs.name }}
          VERSION: ${{ needs.plan.outputs.version }}
          APP_DIGEST: ${{ steps.digest.outputs.sha }}
          XCODE: ${{ steps.digest.outputs.xcode }}
          MACOS: ${{ steps.digest.outputs.macos }}
        run: |
          sha=$(cut -d' ' -f1 "build/$NAME.sha256")
          cat > build/notes.md <<EOF
          ## Install

          1. Download **$NAME** below, open it and drag Reelmark to Applications.
          2. Open Reelmark. macOS will say it can't verify the developer — Reelmark is free and not notarised by Apple.
          3. Open **System Settings › Privacy & Security**, scroll down and click **Open Anyway**, then confirm. Needed once per version.
          4. First time only: open **Reelmark › Settings**, paste your free TMDB access token and choose your Jellyfin Movies and Shows folders. After an update, macOS asks once whether Reelmark may read the token from your Keychain; choose **Always Allow**.

          Only download Reelmark from this Releases page.

          ## Verify it yourself (optional)

          You don't have to trust this page, the maintainer or the AI that wrote the code. On a Mac, from a copy of the source:

          \`\`\`
          scripts/verify-release.sh $VERSION            # checksum, signed build record, app contents, permissions
          scripts/verify-release.sh $VERSION --rebuild  # also rebuild from source and compare
          \`\`\`

          DMG SHA-256: \`$sha\`

          ## Rebuild it yourself (optional)

          This release is reproducible: building commit \`$GITHUB_SHA\` with $XCODE gives an app with digest \`$APP_DIGEST\` (built on macOS $MACOS). Compare with \`scripts/app-digest.sh\`; the full file list is attached.

          ## Changes
          EOF
          gh release create "v$VERSION" \
            "build/$NAME" "build/$NAME.sha256" "build/Reelmark-$VERSION-app-digest.txt" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Reelmark $VERSION" \
            --notes-file build/notes.md \
            --target "$GITHUB_SHA" \
            --generate-notes

  verify:
    name: Verify release
    needs: [plan, release]
    # A fresh machine runs the same checks users can run: checksum, signed
    # build record, app contents, permissions, and a full rebuild from
    # source that must give exactly the same app.
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify, including a rebuild from source
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: scripts/verify-release.sh "$VERSION" --rebuild
