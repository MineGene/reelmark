name: CodeQL

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same pull request replaces an unfinished scan.
concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Pull requests that change nothing the app or its tests use (see
  # scripts/ci-changes.sh) skip the scan without taking a Mac runner; the
  # check still reports success. Main and the weekly run always scan.
  changes:
    name: Detect app changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      app: ${{ steps.detect.outputs.app }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Detect
        id: detect
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          app=$(scripts/ci-changes.sh "$BASE" "$HEAD")
          echo "app=$app" >> "$GITHUB_OUTPUT"
          [ "$app" = true ] || echo "No code changes in this pull request; CodeQL scan skipped."

  analyze:
    name: Analyze Swift
    needs: changes
    # Runs unless the detector said "false": a failed detection still scans.
    if: ${{ !cancelled() && needs.changes.outputs.app != 'false' }}
    # CodeQL can't analyse Swift built with Xcode 27 / Swift 6.4 (GitHub
    # changelog, 2026-10-19), so the scan uses the last supported Xcode on a
    # macOS 26 runner. It reads the same source; releases still use Xcode 27.
    # Move this back to xcode-27 once CodeQL supports it.
    runs-on: macos-26
    timeout-minutes: 45
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select Xcode supported by CodeQL
        run: scripts/select-xcode.sh 26.6

      - uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          languages: swift
          build-mode: manual

      # CodeQL reads the source, so an unoptimised, unsigned debug build gives
      # the same results as a release build and compiles far faster.
      - name: Build (debug, for analysis)
        run: |
          xcodebuild build \
            -project Reelmark.xcodeproj \
            -scheme Reelmark \
            -configuration Debug \
            -destination 'generic/platform=macOS' \
            -derivedDataPath build/CodeQL \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            -quiet

      - uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          category: "/language:swift"
