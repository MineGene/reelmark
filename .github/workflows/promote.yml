name: Promote release

# The weekly release train. Every merged app change is published as a
# pre-release (release.yml) with a "Check <version> on a Mac" issue for its
# hand checks. Each Monday morning in Queensland this promotes the newest
# pre-release whose checks, and those of every pre-release before it, are
# done (its issue closed, or none needed) to the latest stable release.
#
# For an urgent fix: Actions tab › Promote release › Run workflow, with the
# version to promote straight away.
on:
  schedule:
    - cron: "43 22 * * 0" # Monday 8:43 am in Queensland
  workflow_dispatch:
    inputs:
      version:
        description: "Version to promote now, e.g. 0.1.12 (blank = the newest checked pre-release)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: promote
  cancel-in-progress: false

jobs:
  promote:
    name: Promote the newest checked pre-release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # mark a release as the latest stable one
      issues: read # read the Mac checklist issues
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Promote
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: scripts/promote-release.sh "$VERSION"
