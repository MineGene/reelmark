# Settings for Gemini Code Assist, the code review app on this repository.
# https://developers.google.com/gemini-code-assist/docs/customize-gemini-behavior-github
have_fun: false
code_review:
  disable: false
  # Medium and above: real bugs and rule breaks, not style preferences,
  # which swift-format already checks.
  comment_severity_threshold: MEDIUM
  max_review_comments: -1
  pull_request_opened:
    help: false
    summary: true
    code_review: true
ignore_patterns:
  - "docs/**"
  - "Reelmark/AppIcon.icon/**"
